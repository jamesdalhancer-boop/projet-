<style>
/* ============ PROJECT 79 : identité ============ */
:root{
  --bg:#060B08; --s1:#0D1410; --s2:#131C17; --s3:#1C2821; --line:rgba(255,255,255,.075);
  --tx:#EEF4EF; --mu:#8C9C93; --mu2:#5F6F66;
  --g:#35E58A; --g2:#13A862; --gd:rgba(53,229,138,.13);
  --sand:#E9D8A6; --sky:#9DB8FF; --warn:#FF9C8A;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
button:disabled{opacity:.35}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:540px;margin:0 auto}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 16px) 16px 20px}
#nav{display:flex;padding:8px 8px calc(var(--sab) + 6px);background:rgba(7,12,9,.9);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
#nav button{flex:1;background:none;border:0;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--mu2);font-size:10.5px;font-weight:600}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--g)}
#restbar{display:none;align-items:center;gap:8px;padding:10px 14px;background:var(--s2);border-top:1px solid rgba(53,229,138,.35)}
#restbar.on{display:flex}

.h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:0 0 14px}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.t{font-weight:700;font-size:16px}
.sub{color:var(--mu);font-size:13px}
.lbl{color:var(--mu);font-size:13px;font-weight:600}
.num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g{color:var(--g)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.sp{flex:1;min-width:0}
.tr{text-align:right}.tc{text-align:center}
.pad{padding:10px 0}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.card.soft{background:var(--s2);border-radius:16px;padding:12px}
.card.note{background:var(--gd);border-color:rgba(53,229,138,.28)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin-bottom:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--s3);color:var(--tx);
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--g);color:#04140B}
.btn.out{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn.dng{color:var(--warn)}
.btn.block{display:flex;width:100%;margin-top:10px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mu);font-weight:650;font-size:13.5px;padding:9px 10px;border-radius:11px;white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx)}
.bar{height:8px;border-radius:8px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--g);transition:width .35s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--s2);color:var(--mu);border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--gd);border-color:rgba(53,229,138,.45);color:var(--g)}
.chip.rest{opacity:.55;border-style:dashed}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-of-type{border-bottom:0}
.cat{font-size:12px;font-weight:700;color:var(--g);padding:14px 0 2px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:5px;font-weight:600}
.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--tx);outline:none;min-height:46px;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--g)}
textarea.in{min-height:90px;resize:none}
.empty{color:var(--mu);font-size:13.5px;padding:18px 4px;text-align:center}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{fill:var(--mu2);font-size:10px;font-family:var(--num);font-weight:600}

/* Accueil : la piste de 90 jours */
.brand{font-family:var(--num);font-weight:800;letter-spacing:.14em;font-size:13px}
.brand b{color:var(--g)}
.dayline{display:flex;align-items:baseline;gap:10px;margin:14px 0 12px}
.dayline .num{font-size:64px;line-height:.9}
.ticks{display:flex;gap:2px;align-items:flex-end;height:26px}
.ticks i{flex:1;height:11px;border-radius:2px;background:var(--s3)}
.ticks i.b{height:22px}
.ticks i.d{background:var(--g2)}
.ticks i.n{background:var(--g);box-shadow:0 0 10px rgba(53,229,138,.8)}
.scale{position:relative;height:34px;margin:14px 6px 4px}
.scale:before{content:"";position:absolute;left:0;right:0;top:15px;height:4px;border-radius:4px;background:var(--s3)}
.scale .fill{position:absolute;left:0;top:15px;height:4px;border-radius:4px;background:var(--g)}
.scale .dot{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--g);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--g)}

/* Séance */
.fig{width:60px;height:60px;flex:none;background:var(--s2);border-radius:16px}
.fig.big{width:210px;height:210px;display:block;margin:4px auto 14px;border-radius:26px}
.ffar{fill:none;stroke:#56675E;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fnear{fill:none;stroke:#E4EDE7;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fbody{fill:#E4EDE7;stroke:#E4EDE7;stroke-width:8;stroke-linejoin:round}
.fhead{fill:#E4EDE7}
.fdb{stroke:var(--g);stroke-width:5.5;stroke-linecap:round}
.ffl{stroke:var(--s3);stroke-width:2;stroke-linecap:round}
.set{display:flex;align-items:center;gap:8px;padding:6px 0}
.set .sn{width:22px;color:var(--mu);font-weight:700;font-family:var(--num)}
.set .in{width:76px;min-height:42px;padding:8px 10px;text-align:center}
.set .u{color:var(--mu);font-size:12.5px;flex:1}
.set .chk{width:46px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--mu2);font-size:18px;font-weight:800}
.set.done .chk{background:var(--g);color:#04140B;border-color:var(--g)}
.set.done .in{color:var(--g)}

/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal b{font-size:11px;color:var(--mu2);text-align:center;font-weight:700;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:11px;background:var(--s2);border:1px solid transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12.5px var(--num);position:relative;padding:0}
.cd.fut{opacity:.42}
.cd.now{border-color:var(--g);color:var(--tx)}
.cd.bil:after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--sand)}
.cd u{position:absolute;bottom:4px;width:10px;height:3px;border-radius:3px;background:var(--tx)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{padding:0;border:0;background:var(--s2);border-radius:12px;overflow:hidden;aspect-ratio:3/4;position:relative}
.photos img,.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.photos span,.cmp span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp div{border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--s2);position:relative}

.how{padding-left:20px;margin:12px 0}.how li{margin-bottom:8px}
/* Feuilles, toasts, lancement */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s1);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(var(--sab) + 22px);max-width:540px;margin:0 auto}
.sheet.anim{animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 12px);background:#E9F2EC;color:#06100A;padding:10px 16px;
  border-radius:999px;font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:88%;text-align:center}
#toast.on{opacity:1}
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash svg{width:132px;height:132px}
#splash .arc{stroke-dasharray:302;stroke-dashoffset:302;animation:arc 1s .1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes arc{to{stroke-dashoffset:63}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash .arc{stroke-dashoffset:63}}

/* ============ Liquid Glass (iOS 26 / 27) ============
   Couche de navigation et de contrôle en verre : translucide, floue, bord lumineux, formes en capsule, éléments flottants.
   Le contenu (cartes) reste lisible et calme en dessous. --ga règle la teinte, comme le curseur clair / teinté d'iOS 27. */
:root{--ga:.44;--gb:24px;--glass:rgba(24,34,29,var(--ga));--gf:blur(var(--gb)) saturate(180%) brightness(1.1);
  --edge:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(255,255,255,.07);--lift:0 12px 32px rgba(0,0,0,.45)}
:root[data-glass=clair]{--ga:.2;--gb:14px}
:root[data-glass=teinte]{--ga:.78;--gb:30px}
@media (prefers-reduced-transparency:reduce){:root,:root[data-glass]{--ga:.95}}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(70% 38% at 10% 0%,rgba(53,229,138,.22),transparent 70%),
  radial-gradient(55% 34% at 105% 48%,rgba(19,168,98,.16),transparent 70%),
  radial-gradient(70% 40% at 15% 104%,rgba(157,184,255,.12),transparent 70%)}
#view{position:absolute;inset:0;padding-bottom:calc(var(--sab) + 118px);scroll-padding-bottom:150px;
  -webkit-mask-image:linear-gradient(transparent 0,#000 calc(var(--sat) + 12px));mask-image:linear-gradient(transparent 0,#000 calc(var(--sat) + 12px))}
#nav,#restbar,#toast{background:var(--glass);-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);box-shadow:var(--edge),var(--lift);border:0}
#nav{position:absolute;left:14px;right:14px;bottom:max(10px,calc(var(--sab) - 10px));padding:5px;border-radius:999px;z-index:20}
#nav button{border-radius:999px;padding:7px 0 6px;transition:background .25s}
#nav button.on{background:rgba(255,255,255,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
#restbar{position:absolute;left:14px;right:14px;bottom:calc(max(10px,calc(var(--sab) - 10px)) + 76px);border-radius:30px;padding:10px 10px 10px 20px;z-index:19}
#toast{color:var(--tx)}
.card{background:rgba(15,23,19,.74);border-color:rgba(255,255,255,.07);border-radius:26px}
.card.soft{background:rgba(255,255,255,.045);border-radius:18px}
.card.note{background:rgba(53,229,138,.12)}
.btn,.btn.sm{border-radius:999px}
.btn{background:rgba(255,255,255,.09);box-shadow:var(--edge)}
.btn.pri{background:linear-gradient(180deg,#52F2A0,#27D67C);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.14),0 6px 20px rgba(53,229,138,.26)}
.btn.out{background:transparent;border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.seg{border:0;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:var(--edge)}
.seg button{border-radius:999px}
.seg button.on{background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.in{border-radius:16px;background:rgba(255,255,255,.06)}
.set .chk{border-radius:999px;background:rgba(255,255,255,.07);box-shadow:var(--edge);border:0}
.set.done .chk{background:linear-gradient(180deg,#52F2A0,#27D67C)}
.scrim{background:rgba(0,0,0,.42)}
.sheet{left:8px;right:8px;bottom:8px;border:0;border-radius:38px;max-height:calc(100% - var(--sat) - 28px);
  background:rgba(20,29,24,calc(var(--ga) + .34));-webkit-backdrop-filter:var(--gf);backdrop-filter:var(--gf);box-shadow:var(--edge),0 -8px 44px rgba(0,0,0,.55);
  padding-bottom:calc(max(var(--sab) - 8px,0px) + 22px)}
.grab{background:rgba(255,255,255,.22)}
</style>

<script>
'use strict';
/* =====================================================================
   PROJECT 79  -  application personnelle, 100 % locale
   Sommaire : 1. Utilitaires  2. Données de référence  3. Stockage (IndexedDB)
   4. État et calculs  5. Composants (graphiques, feuilles)  6. Écrans
   7. Actions  8. Export / import  9. Démarrage et hors ligne
   ===================================================================== */
const APP_VERSION='1.1.0', N_DAYS=90, BILANS=[1,15,30,45,60,75,90];

/* ---------- 1. Utilitaires ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fr=(n,d)=>(n==null||isNaN(n))?'–':Number(n).toFixed(d==null?1:d).replace('.',',');
const kc=n=>Math.round(n).toLocaleString('fr-FR');
const pnum=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pc=(v,g)=>g>0?Math.max(0,Math.min(100,v/g*100)):0;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const DOW=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const dlabel=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const dlong=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};

/* ---------- 2. Données de référence ---------- */
/* Valeurs moyennes indicatives pour 100 g : [id, nom, catégorie, kcal, protéines, glucides, lipides, portion par défaut]
   Aucune entrée avec porc, poisson, œuf, lactose ou brocoli. */
const FOODS=[
['poulet','Blanc de poulet cuit','Protéines',165,31,0,3.6,200],
['dinde','Escalope de dinde cuite','Protéines',135,29,0,1.5,200],
['steak5','Steak haché 5 % (cru)','Protéines',129,21,0,5,200],
['boeuf','Bœuf maigre cuit','Protéines',170,28,0,6,180],
['veau','Escalope de veau cuite','Protéines',150,28,0,4,180],
['dindetr','Blanc de dinde en tranches','Protéines',105,20,1.5,2,80],
['tofu','Tofu ferme','Protéines',140,15,2,8,200],
['tempeh','Tempeh','Protéines',195,19,8,11,150],
['seitan','Seitan','Protéines',125,21,4,2,150],
['pst','Protéines de soja texturées (sèches)','Protéines',335,50,25,2,50],
['lentilles','Lentilles cuites','Protéines',115,9,20,0.4,250],
['pchiches','Pois chiches cuits','Protéines',164,9,27,2.6,200],
['hrouges','Haricots rouges cuits','Protéines',127,8.7,22,0.5,200],
['whey','Whey isolate sans lactose (poudre)','Protéines',370,85,4,1.5,30],
['ysoja','Yaourt de soja nature','Protéines',45,4,1,2.3,200],
['lsoja','Boisson de soja non sucrée','Protéines',35,3.3,1,1.8,250],
['riz','Riz blanc cuit','Féculents',130,2.7,28,0.3,250],
['pates','Pâtes cuites','Féculents',150,5,30,0.9,250],
['pdt','Pommes de terre cuites','Féculents',80,2,17,0.1,300],

function poseSVG(p,db){
  const pl=a=>a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const far=p[1][0]!==p[2][0]?'fnear':'ffar';
  const side=p[1][0]===p[2][0];
  const d=w=>side?`<circle cx="${w[0]}" cy="${w[1]}" r="5.5" fill="var(--g)"/>`:db.o==='v'?`<line x1="${w[0]}" y1="${w[1]-6}" x2="${w[0]}" y2="${w[1]+6}" class="fdb"/>`:`<line x1="${w[0]-6}" y1="${w[1]}" x2="${w[0]+6}" y2="${w[1]}" class="fdb"/>`;
  let s=`<line x1="8" y1="114" x2="112" y2="114" class="ffl"/><polyline points="${pl([p[3],p[9],p[10]])}" class="${far}"/><polyline points="${pl([p[1],p[5],p[6]])}" class="${far}"/>`+
    `<polygon points="${pl([p[1],p[2],p[4],p[3]])}" class="fbody"/><circle cx="${p[0][0]}" cy="${p[0][1]}" r="7.5" class="fhead"/>`+
    `<polyline points="${pl([p[4],p[11],p[12]])}" class="fnear"/><polyline points="${pl([p[2],p[7],p[8]])}" class="fnear"/>`;
  if(db){if(db.h!=='R')s+=d(p[6]);s+=d(p[8])}
  return s;
}
function fig(ref,cls,id){
  const e=EXLIB[ref];
  const inner=e?poseSVG(e.b,e.db):'<line x1="8" y1="114" x2="112" y2="114" class="ffl"/><path d="M34 60h52M34 46v28M26 52v16M86 46v28M94 52v16" class="fnear"/>';
  return `<svg class="fig ${cls||''}" ${id?'id="'+id+'"':''} viewBox="0 0 120 120" aria-hidden="true">${inner}</svg>`;
}

/* ---------- 3. Stockage (IndexedDB, repli en mémoire si indisponible) ---------- */
const STORES=[['kv','k'],['days','date'],['measures','date'],['sessions','id'],['photos','id'],['bilans','day']];
const DB={db:null,mem:false,
  open(){return new Promise(res=>{let done=false;const fin=m=>{if(done)return;done=true;DB.mem=m;res()};
    setTimeout(()=>fin(true),3000);
    try{const r=indexedDB.open('project79',1);
      r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s[0]))d.createObjectStore(s[0],{keyPath:s[1]})})};
      r.onsuccess=()=>{DB.db=r.result;DB.db.onversionchange=()=>DB.db.close();fin(false)};
      r.onerror=()=>fin(true);r.onblocked=()=>fin(true);
    }catch(e){fin(true)}})},
  tx(store,mode,fn){if(DB.mem||!DB.db)return Promise.resolve(mode==='readonly'?[]:undefined);
    return new Promise((res,rej)=>{try{const t=DB.db.transaction(store,mode),q=fn(t.objectStore(store));
      if(mode==='readonly'){q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}
      else{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}}catch(e){rej(e)}})},
  all:s=>DB.tx(s,'readonly',o=>o.getAll()),
  put:(s,v)=>DB.tx(s,'readwrite',o=>o.put(v)).catch(DB.fail),
  del:(s,k)=>DB.tx(s,'readwrite',o=>o.delete(k)).catch(DB.fail),
  clear:s=>DB.tx(s,'readwrite',o=>o.clear()).catch(DB.fail),
  fail(e){console.error(e);toast('Enregistrement impossible : '+(e&&e.name==='QuotaExceededError'?'stockage plein':'erreur de stockage'))}
};

const mlist=()=>Object.values(S.measures).sort((a,b)=>a.date<b.date?-1:1);

function totals(d){const t={kcal:0,p:0,g:0,l:0};getDay(d).meals.forEach(m=>{t.kcal+=m.kcal;t.p+=m.p;t.g+=m.g;t.l+=m.l});return t}
function habitList(d){const tr=S.program.some(p=>p.dow===parse(d).getDay()),h=getDay(d).h;
  return HABITS.filter(x=>!(x[0]==='whey'&&!S.settings.whey)&&!(x[0]==='crea'&&!S.settings.creatine)).map(x=>({k:x[0],n:x[1],on:!!h[x[0]],rest:x[0]==='train'&&!tr&&!h.train}))}
function score(d){const L=habitList(d).filter(x=>!x.rest),done=L.filter(x=>x.on).length;return{done,total:L.length,pct:L.length?Math.round(done/L.length*100):0}}
function weekAvgs(){const w={};mlist().forEach(m=>{const n=dayNo(m.date);if(m.weight==null||n<1||n>N_DAYS)return;const k=Math.ceil(n/7);(w[k]=w[k]||[]).push(m.weight)});
  return Object.keys(w).map(k=>({w:+k,avg:w[k].reduce((a,b)=>a+b,0)/w[k].length})).sort((a,b)=>a.w-b.w)}
function nextSession(){const t=today();for(let i=0;i<8;i++){const d=addDays(t,i),p=S.program.find(p=>p.dow===parse(d).getDay());if(p&&!S.sessions.some(s=>s.date===d&&s.pid===p.id))return{d,p,i}}return null}
function lastPerf(name){const L=S.sessions.slice().sort((a,b)=>b.start-a.start);for(const s of L){const e=s.ex.find(x=>x.name===name);if(e&&e.sets.length)return e.sets.map(x=>x.r)}return null}
function addMeal(d,slot,f,grams){const k=grams/100,x=day(d);
  x.meals.push({id:uid(),slot,fid:f.id,name:f.name,grams,kcal:f.kcal*k,p:f.p*k,g:f.g*k,l:f.l*k});
  if(slot==='m1'||slot==='m2')x.h[slot]=true;if(f.id==='whey'&&S.settings.whey)x.h.whey=true;
  if(totals(d).p>=S.settings.prot)x.h.prot=true}
const applyGlass=()=>{document.documentElement.dataset.glass=S.settings.glass||'defaut'};

const seg=(k,o)=>`<div class="seg">${o.map(x=>`<button class="${S.ui[k]===x[0]?'on':''}" data-a="seg" data-k="${k}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
const mac4=t=>`<div class="grid4 mt"><div><div class="num">${kc(t.kcal)}</div><div class="sub">kcal</div></div><div><div class="num g">${Math.round(t.p)}</div><div class="sub">protéines</div></div><div><div class="num">${Math.round(t.g)}</div><div class="sub">glucides</div></div><div><div class="num">${Math.round(t.l)}</div><div class="sub">lipides</div></div></div>`;
const chip=(d,x,sh)=>`<button class="chip ${x.on?'on':''} ${x.rest?'rest':''}" data-a="hab" data-d="${d}" data-k="${x.k}" ${sh?'data-sh="1"':''} aria-pressed="${x.on}">${x.on?'✓ ':''}${x.rest?'Repos, pas de séance prévue':x.n}</button>`;
function lineChart(o){
  if(!o.series.some(s=>s.data&&s.pts.length))return `<div class="empty">${o.empty||'Pas encore de données.'}</div>`;
  let ys=[];o.series.forEach(s=>s.pts.forEach(p=>ys.push(p[1])));if(o.goal!=null)ys.push(o.goal);
  let mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);const pad=Math.max((mx-mn)*.12,o.pad||.5);mn-=pad;mx+=pad;if(o.lo!=null)mn=o.lo;if(o.hi!=null)mx=o.hi;
  const W=340,H=o.h||160,L=34,R=10,T=10,B=20,X=x=>L+(x-o.x0)/((o.x1-o.x0)||1)*(W-L-R),Y=y=>T+(mx-y)/((mx-mn)||1)*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/><text x="${L-5}" y="${+y+3}" text-anchor="end">${fr(v,o.dec==null?1:o.dec)}</text>`}
  (o.xl||[]).forEach(l=>{g+=`<text x="${X(l[0]).toFixed(1)}" y="${H-5}" text-anchor="middle">${l[1]}</text>`});
  if(o.goal!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.goal).toFixed(1)}" y2="${Y(o.goal).toFixed(1)}" stroke="var(--g)" stroke-dasharray="2 5" stroke-width="1.5" opacity=".7"/>`;
  o.series.forEach(s=>{if(!s.pts.length)return;
    g+=`<path d="M${s.pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" stroke-linecap="round" stroke-linejoin="round" ${s.dash?'stroke-dasharray="'+s.dash+'"':''} opacity="${s.op||1}"/>`;
    if(s.dots)s.pts.forEach(p=>{g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" fill="${s.c}" stroke="#0D1410" stroke-width="1.5"/>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Graphique')}">${g}</svg>`;
}
function barChart(v,max,lab){const W=340,H=120,L=8,B=18,T=8,bw=(W-2*L)/v.length;let g='';
  v.forEach((x,i)=>{const h=Math.max(3,(H-T-B)*Math.min(1,x/max));g+=`<rect x="${(L+i*bw+bw*.18).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x>=max?'var(--g)':x>0?'var(--g2)':'var(--s3)'}"/>`;
    if(lab[i])g+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${lab[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine">${g}</svg>`}
const XL=[[1,'J1'],[30,'J30'],[60,'J60'],[90,'J90']];
function weightChart(h){const s=S.settings,ok=m=>dayNo(m.date)>=1&&dayNo(m.date)<=N_DAYS,pts=mlist().filter(m=>m.weight!=null&&ok(m)).map(m=>[dayNo(m.date),m.weight]),wa=weekAvgs().map(a=>[(a.w-1)*7+4,a.avg]);
  return lineChart({h:h||170,x0:1,x1:N_DAYS,goal:s.targetW,xl:XL,empty:'Ajoute une première pesée pour voir la courbe.',label:'Évolution du poids',
    series:[{pts:[[1,s.startW],[N_DAYS,s.targetW]],c:'#fff',w:1,dash:'3 4',op:.25},{pts:wa.length>1?wa:[],c:'var(--sand)',w:2},{pts,c:'var(--g)',dots:1,data:1}]})}
function animFig(ref){cancelAnimationFrame(figRAF);const e=EXLIB[ref];if(!e||!$('#figA'))return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const t0=performance.now(),step=t=>{const el=$('#figA');if(!el)return;const k=(1-Math.cos(((t-t0)%2600)/2600*2*Math.PI))/2;
    el.innerHTML=poseSVG(e.a.map((q,i)=>[q[0]+(e.b[i][0]-q[0])*k,q[1]+(e.b[i][1]-q[1])*k]),e.db);figRAF=requestAnimationFrame(step)};
  figRAF=requestAnimationFrame(step)}

const V={};
V.home=()=>{
  const s=S.settings,t=today(),n=dayNo(t),cur=Math.max(0,Math.min(N_DAYS,n));
  const lw=lastW(),w=lw?lw.weight:s.startW,tot=s.startW-s.targetW,wp=tot>0?Math.max(0,Math.min(1,(s.startW-w)/tot)):0,rem=w-s.targetW;
  const tt=totals(t),sc=score(t),nx=nextSession(),pend=BILANS.filter(b=>b<=n&&!S.bilans[b]).pop();
  let ticks='';for(let i=1;i<=N_DAYS;i++)ticks+=`<i class="${BILANS.includes(i)?'b ':''}${i<cur||n>N_DAYS?'d':i===cur?'n':''}"></i>`;
  const head=n<1?`<div class="dayline"><span class="num" style="font-size:44px">J−${1-n}</span><span class="sub">Début le ${dlabel(s.start)}</span></div>`

  return `<div class="row between"><div class="brand">PROJECT <b>79</b></div><span class="sub">${dlong(t)}</span></div>
  ${head}<div class="ticks" aria-hidden="true">${ticks}</div><div class="row between sub" style="margin:6px 0 16px"><span>${dlabel(s.start)}</span><span>${dlabel(endD())}</span></div>
  ${S.mem?'<div class="card note sub">Aperçu : le stockage local n’est pas disponible ici, rien ne sera conservé. Une fois l’app installée sur ton iPhone, tes données sont enregistrées sur l’appareil.</div>':''}
  ${!S.mem&&!standalone()&&!S.meta.hintOff&&location.protocol==='https:'?'<div class="card note"><div class="t">Installe l’app avant de saisir tes données</div><div class="sub">Dans Safari : bouton Partager, puis « Sur l’écran d’accueil ». L’app installée a son propre espace de stockage.</div><button class="btn sm mt" data-a="hintOff">Compris</button></div>':''}
  ${S.active?`<div class="card note"><div class="row"><div class="sp"><span class="lbl">Séance en cours</span><div class="t">${esc(S.active.title)}</div></div><button class="btn pri sm" data-a="tab" data-t="sport">Reprendre</button></div></div>`:''}
  ${pend&&s.remind?`<div class="card note"><div class="row"><div class="sp"><span class="lbl">Bilan du jour ${pend}</span><div class="t">Quelques mesures pour faire le point</div></div><button class="btn pri sm" data-a="bilan" data-b="${pend}">Faire le bilan</button></div></div>`:''}
  <div class="card"><div class="row between"><span class="lbl">Poids</span><button class="btn sm" data-a="mAdd">+ Pesée</button></div>
    <div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-size:42px">${fr(w)}</span><span class="sub">kg${lw?', le '+dlabel(lw.date):', poids de départ'}</span></div>
    <div class="scale"><div class="fill" style="width:${wp*100}%"></div><div class="dot" style="left:${wp*100}%"></div></div>
    <div class="row between sub"><span>Départ ${fr(s.startW)}</span><span class="g">${rem>0?'Reste '+fr(rem)+' kg':'Cible atteinte'}</span><span>Cible ${fr(s.targetW)}</span></div>
    ${hasW?'<div class="mt">'+weightChart(120)+'</div>':''}</div>
  <div class="grid2 mb" data-a="tab" data-t="nutrition">
    <div class="card"><span class="lbl">Calories du jour</span><div><span class="num" style="font-size:26px">${kc(tt.kcal)}</span> <span class="sub">sur ${kc(s.kcal)}</span></div><div class="bar"><i style="width:${pc(tt.kcal,s.kcal)}%"></i></div></div>
    <div class="card"><span class="lbl">Protéines</span><div><span class="num" style="font-size:26px">${Math.round(tt.p)}</span> <span class="sub">sur ${s.prot} g</span></div><div class="bar"><i style="width:${pc(tt.p,s.prot)}%"></i></div></div>
  </div>
  ${nx?`<div class="card"><div class="row"><div class="sp"><span class="lbl">${nx.i===0?'Séance du jour':'Prochaine séance'}</span><div class="t" style="font-size:19px">${esc(nx.p.title)}</div><div class="sub">${nx.i===0?'Aujourd’hui':nx.i===1?'Demain':dlong(nx.d)}, ${nx.p.ex.length} exercices</div></div>${fig(nx.p.ex[0]&&nx.p.ex[0].ref)}</div>
    <button class="btn ${nx.i===0&&!S.active?'pri':''} block" data-a="${nx.i===0?'startW':'openSp'}" data-id="${nx.p.id}">${nx.i===0?'Démarrer la séance':'Voir la séance'}</button></div>`:''}
  <div class="card"><div class="row between mb"><span class="lbl">Habitudes du jour</span><span class="num g">${sc.pct} %</span></div>
    <div class="chips">${habitList(t).map(x=>chip(t,x)).join('')}</div><div class="sub mt">${sc.done?sc.done+' sur '+sc.total+' validées.':'Rien de coché pour l’instant, touche une habitude quand elle est faite.'}</div></div>`;

V.nutrition=()=>{const h=`<h1 class="h1">Nutrition</h1>${seg('nt',[['journal','Journal'],['idees','Idées repas'],['courses','Courses']])}`;
  return h+(S.ui.nt==='idees'?ideesHTML():S.ui.nt==='courses'?coursesHTML():journalHTML())};
function journalHTML(){const d=S.ui.nd,s=S.settings,t=totals(d),dy=getDay(d),n=dayNo(d),diff=s.kcal-t.kcal;
  const mac=(l,v,g,c)=>`<div class="sp"><span class="lbl">${l}</span><div class="sub"><b class="num" style="color:var(--tx);font-size:16px">${Math.round(v)}</b> sur ${g} g</div><div class="bar"><i style="width:${pc(v,g)}%;background:${c}"></i></div></div>`;
  let hist='';for(let i=0;i<7;i++){const x=addDays(today(),-i),tx=totals(x);hist+=`<div class="li" data-a="goJournal" data-d="${x}"><div class="sp">${i===0?'Aujourd’hui':dlong(x)}</div><div class="tr"><span class="num">${kc(tx.kcal)}</span> <span class="sub">kcal, ${Math.round(tx.p)} g prot.</span></div></div>`}
  return `<div class="row between mb"><button class="btn sm" data-a="nd" data-v="-1" aria-label="Jour précédent">‹</button><div class="tc"><div class="t">${d===today()?'Aujourd’hui':dlong(d)}</div><div class="sub">${n>=1&&n<=N_DAYS?'Jour '+n+' sur 90':dlabel(d)}</div></div><button class="btn sm" data-a="nd" data-v="1" aria-label="Jour suivant" ${d>=today()?'disabled':''}>›</button></div>
  <div class="card"><div class="row between"><span class="lbl">Calories</span><span class="sub">${diff>=0?'Reste '+kc(diff)+' kcal':kc(-diff)+' kcal au-dessus du repère'}</span></div>
    <div><span class="num" style="font-size:38px">${kc(t.kcal)}</span> <span class="sub">sur ${kc(s.kcal)} kcal</span></div><div class="bar mb"><i style="width:${pc(t.kcal,s.kcal)}%"></i></div>
    <div class="row mt" style="align-items:flex-start">${mac('Protéines',t.p,s.prot,'var(--g)')}${mac('Glucides',t.g,s.carb,'var(--sand)')}${mac('Lipides',t.l,s.fat,'var(--sky)')}</div></div>
  ${SLOTS.map(sl=>{const it=dy.meals.filter(m=>m.slot===sl[0]),k=it.reduce((a,m)=>a+m.kcal,0),p=it.reduce((a,m)=>a+m.p,0);
    return `<div class="card"><div class="row between"><div class="t">${sl[1]}</div><span class="sub">${it.length?kc(k)+' kcal, '+Math.round(p)+' g prot.':''}</span></div>
    ${it.map(m=>`<div class="li" data-a="editMeal" data-id="${m.id}"><div class="sp"><div>${esc(m.name)}</div><div class="sub">${fr(m.grams,0)} g, P ${Math.round(m.p)} G ${Math.round(m.g)} L ${Math.round(m.l)}</div></div><div class="num">${kc(m.kcal)}</div></div>`).join('')||'<div class="sub pad">Aucun aliment noté.</div>'}
    <button class="btn sm block" data-a="addFood" data-slot="${sl[0]}">+ Ajouter un aliment</button></div>`}).join('')}
  <div class="card"><div class="t">7 derniers jours</div>${hist}</div>`}
function sugTotals(s){const t={kcal:0,p:0,g:0,l:0};s.it.forEach(x=>{const f=FOODS.find(f=>f.id===x[0]),k=x[1]/100;t.kcal+=f.kcal*k;t.p+=f.p*k;t.g+=f.g*k;t.l+=f.l*k});return t}
function ideesHTML(){const blk=k=>SUGG.map((s,i)=>s.k!==k?'':`<div class="card"><div class="t">${s.n}</div><div class="sub">${s.it.map(x=>x[1]+' g '+FOODS.find(f=>f.id===x[0]).name.toLowerCase()).join(', ')}</div>${mac4(sugTotals(s))}
    <div class="row mt">${k==='repas'?`<button class="btn sm sp" data-a="sug" data-i="${i}" data-slot="m1">Repas 1</button><button class="btn sm sp" data-a="sug" data-i="${i}" data-slot="m2">Repas 2</button>`:`<button class="btn sm sp" data-a="sug" data-i="${i}" data-slot="x">Ajouter en collation</button>`}<button class="btn sm out" data-a="sugShop" data-i="${i}">Courses</button></div></div>`).join('');

function coursesHTML(){const L=S.shopping;return `<div class="row mb"><input class="in sp" id="shop_in" placeholder="Ajouter un article" autocomplete="off" enterkeyhint="done"><button class="btn pri" data-a="shopAdd">Ajouter</button></div>
  <div class="card">${L.length?L.map(x=>`<div class="li"><button class="chip ${x.done?'on':''}" data-a="shopTog" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="Cocher ${esc(x.name)}">${x.done?'✓':'○'}</button><div class="sp" style="${x.done?'text-decoration:line-through;color:var(--mu)':''}">${esc(x.name)}</div><button class="btn sm out" data-a="shopDel" data-id="${x.id}" aria-label="Retirer ${esc(x.name)}">×</button></div>`).join(''):'<div class="empty">Ta liste est vide. Ajoute des articles ou pars de la liste type.</div>'}</div>

function regulHTML(){const t=today(),n=Math.max(0,Math.min(N_DAYS,dayNo(t))),s=S.settings;let planned=0,plannedTot=0,sum=0,food=0;const pts=[];

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))}catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))};im.src=url})}

function prepExport(name,mime,text,backup){const blob=new Blob([text],{type:mime});let file=null;try{file=new File([blob],name,{type:mime})}catch(e){}
  if(EXP&&EXP.url)URL.revokeObjectURL(EXP.url);EXP={name,file,url:URL.createObjectURL(blob),backup};
  let can=false;try{can=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const sz=blob.size>1048576?fr(blob.size/1048576)+' Mo':Math.max(1,Math.round(blob.size/1024))+' Ko';
  sheet(`<h2>Fichier prêt</h2><p class="sub">${esc(name)}, ${sz}</p>${can?'<button class="btn pri block" data-a="share">Partager ou enregistrer dans Fichiers</button>':''}<a class="btn block ${can?'out':'pri'}" href="${EXP.url}" download="${esc(name)}" data-a="dlMark">Télécharger le fichier</a><button class="btn out block" data-a="close">Fermer</button>`)}
const markBackup=()=>{if(EXP&&EXP.backup){S.meta.lastBackup=today();saveKV('meta');const e=$('#stinfo');if(e)e.textContent=storageLine()}};
A.share=()=>{try{navigator.share({files:[EXP.file],title:EXP.name}).then(()=>{markBackup();closeSheet()}).catch(()=>{})}catch(e){toast('Partage indisponible, utilise Télécharger')}};
A.dlMark=()=>{markBackup()};
A.expJSON=async()=>{let photos=[];try{photos=S.mem?(S.photos||[]):await DB.all('photos')}catch(e){}
  const o={app:'project79',format:1,version:APP_VERSION,exported:new Date().toISOString(),settings:S.settings,program:S.program,foods:S.foods,shopping:S.shopping,
    days:Object.values(S.days).filter(d=>d.meals.length||Object.keys(d.h).length),measures:Object.values(S.measures),sessions:S.sessions,bilans:Object.values(S.bilans),photos};
  prepExport('project79-sauvegarde-'+today()+'.json','application/json',JSON.stringify(o),true)};
const csv=rows=>'\ufeff'+rows.map(r=>r.map(c=>{c=c==null?'':typeof c==='number'?String(Math.round(c*100)/100).replace('.',','):String(c);return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
A.expCSV=d=>{let R=[];const ds=Object.keys(S.days).sort();
  if(d.k==='mesures'){R=[['date','jour','poids_kg','taille_cm','bras_cm','epaules_cm']];mlist().forEach(m=>R.push([m.date,dayNo(m.date),m.weight,m.waist,m.arm,m.sh]))}
  else if(d.k==='nutrition'){R=[['date','jour','repas','aliment','grammes','kcal','proteines_g','glucides_g','lipides_g']];ds.forEach(x=>S.days[x].meals.forEach(m=>R.push([x,dayNo(x),(SLOTS.find(s=>s[0]===m.slot)||['',''])[1],m.name,m.grams,m.kcal,m.p,m.g,m.l])))}
  else if(d.k==='seances'){R=[['date','jour','seance','exercice','serie','realise','unite','charge_kg']];S.sessions.slice().sort((a,b)=>a.start-b.start).forEach(s=>s.ex.forEach(e=>e.sets.forEach((x,i)=>R.push([s.date,dayNo(s.date),s.title,e.name,i+1,x.r,e.unit==='sec'?'secondes':'repetitions',x.w]))))}
  else{R=[['date','jour'].concat(HABITS.map(h=>h[1]),['score_pct'])];ds.forEach(x=>{const h=S.days[x].h;if(Object.keys(h).length)R.push([x,dayNo(x)].concat(HABITS.map(q=>h[q[0]]?1:0),[score(x).pct]))})}
  if(R.length<2){toast('Aucune donnée à exporter pour l’instant');return}prepExport('project79-'+d.k+'-'+today()+'.csv','text/csv',csv(R))};
C.imp=el=>{const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='project79'||!o.settings)throw 0;IMP=o;
    sheet(`<h2>Importer cette sauvegarde ?</h2><p class="sub">Exportée le ${esc(String(o.exported||'').slice(0,10))} : ${(o.days||[]).length} jours, ${(o.measures||[]).length} mesures, ${(o.sessions||[]).length} séances, ${(o.photos||[]).length} photos.</p><p>Les données actuelles de l’app seront remplacées.</p><button class="btn pri block" data-a="impDo">Remplacer par cette sauvegarde</button><button class="btn out block" data-a="close">Annuler</button>`)}
    catch(e){toast('Ce fichier n’est pas une sauvegarde PROJECT 79')}};
  r.onerror=()=>toast('Lecture du fichier impossible');r.readAsText(f);el.value=''};
A.impDo=async()=>{const o=IMP;if(!o)return;toast('Import en cours…');
  try{for(const s of STORES)await DB.clear(s[0]);
    S.settings=Object.assign(defSettings(),o.settings);S.program=Array.isArray(o.program)&&o.program.length?o.program:defProgram();S.foods=o.foods||[];S.shopping=o.shopping||[];S.active=null;S.meta={};
    S.days={};S.measures={};S.bilans={};S.sessions=(o.sessions||[]).filter(x=>x&&x.id&&x.ex);S.photos=(o.photos||[]).filter(x=>x&&x.id&&x.data);
    (o.days||[]).forEach(d=>{if(d&&d.date)S.days[d.date]={date:d.date,h:d.h||{},meals:d.meals||[]}});(o.measures||[]).forEach(m=>{if(m&&m.date)S.measures[m.date]=m});(o.bilans||[]).forEach(b=>{if(b&&b.day)S.bilans[b.day]=b});
    for(const k of ['settings','program','foods','shopping','meta','active'])await saveKV(k);
    for(const d of Object.values(S.days))await DB.put('days',d);for(const m of Object.values(S.measures))await DB.put('measures',m);
    for(const s of S.sessions)await DB.put('sessions',s);for(const b of Object.values(S.bilans))await DB.put('bilans',b);for(const p of S.photos)await DB.put('photos',p);
    IMP=null;applyGlass();closeSheet();S.ui.tab='home';render(true);tick();toast('Sauvegarde importée')}
  catch(e){console.error(e);toast('Import interrompu, réessaie avec le même fichier')}};
A.ics=()=>{const s=S.settings,tm=(s.wtime||'18:30').replace(':','')+'00',st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PROJECT 79//FR','CALSCALE:GREGORIAN'];
  const ev=(d,t,dur,sum,id)=>L.push('BEGIN:VEVENT','UID:p79-'+id+'@project79','DTSTAMP:'+st,'DTSTART:'+d.replace(/-/g,'')+'T'+t,'DURATION:PT'+dur+'M','SUMMARY:'+sum,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:-PT15M','END:VALARM','END:VEVENT');
  const from=today()>s.start?today():s.start;
  for(let i=1;i<=N_DAYS;i++){const d=addDays(s.start,i-1);if(d<from)continue;const p=S.program.find(q=>q.dow===parse(d).getDay());if(p)ev(d,tm,45,'PROJECT 79 : '+p.title.replace(/[,;\\]/g,' '),'s'+i);if(BILANS.includes(i))ev(d,'080000',15,'PROJECT 79 : bilan du jour '+i,'b'+i)}
  L.push('END:VCALENDAR');prepExport('project79-rappels.ics','text/calendar',L.join('\r\n'))};

/* ---------- 9. Démarrage, minuteur, hors ligne ---------- */
function tick(){const a=S.active,rb=$('#restbar');
  if(a&&a.restEnd){const rem=Math.ceil((a.restEnd-Date.now())/1000);
    if(rem<=0){a.restEnd=null;saveKV('active');rb.className='';rb.innerHTML='';beep();toast('Repos terminé, série suivante')}
    else{if(!rb.className){rb.className='on';rb.innerHTML='<div><div class="lbl">Repos</div><div class="num g" id="rtime" style="font-size:26px;line-height:1"></div></div><div class="sp"></div><button class="btn sm" data-a="restAdj" data-v="-15">−15 s</button><button class="btn sm" data-a="restAdj" data-v="15">+15 s</button><button class="btn sm pri" data-a="restSkip">Passer</button>'}$('#rtime').textContent=mmss(rem)}}
  else if(rb.className){rb.className='';rb.innerHTML=''}
  const c=$('#wclock');if(c&&a)c.textContent=mmss(Math.floor((Date.now()-a.start)/1000))}
function regSW(){if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol)){S.sw='indisponible';return}
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{S.sw='actif'}).catch(()=>{S.sw='indisponible'}).then(()=>{const e=$('#swinfo');if(e)e.textContent=swLine()})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]&&!el.disabled)A[el.dataset.a](el.dataset,el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&I[el.dataset.i])I[el.dataset.i](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='shop_in'){e.preventDefault();A.shopAdd()}if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.ui.last!==today()){S.ui.last=today();S.ui.nd=today()}if(!$('#sheet').classList.contains('open'))render();tick()}});
async function init(){
  await DB.open();
  try{const m={};(await DB.all('kv')).forEach(r=>{m[r.k]=r.v});
    S.settings=Object.assign(defSettings(),m.settings||{});S.program=Array.isArray(m.program)?m.program:defProgram();S.foods=m.foods||[];S.shopping=m.shopping||[];S.meta=m.meta||{};S.active=m.active||null;
    (await DB.all('days')).forEach(d=>{S.days[d.date]=d});(await DB.all('measures')).forEach(x=>{S.measures[x.date]=x});S.sessions=await DB.all('sessions');(await DB.all('bilans')).forEach(b=>{S.bilans[b.day]=b});
  }catch(e){console.error(e);DB.mem=true;S.program=defProgram()}
  S.mem=DB.mem;if(S.mem)S.photos=[];applyGlass();
  if(!S.mem&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>{S.persist=p}).catch(()=>{});
  render(true);tick();setInterval(tick,500);regSW();
  setTimeout(()=>$('#splash').classList.add('off'),1100);
}
init();
</script>
